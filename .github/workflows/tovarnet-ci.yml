name: TovarNet Mexico Transit CI

on:
  push:
    branches:
      - feature/mexico-transit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install
        run: npm ci
      - name: Doctor
        run: npm run doctor
      - name: Format
        run: npm run format:check
      - name: Boundaries
        run: npm run check:boundaries
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
